[project]
name = "freya-voice-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.17.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pipecat-ai[anthropic,elevenlabs,runner,silero,webrtc]>=1.16.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
